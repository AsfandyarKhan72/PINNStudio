name: Platform tests

# The test suite and an end-to-end check of the window (tools/smoke_gui.py)
# on Windows, macOS and Linux. Failing tests are reported as annotations on
# the run (tools/junit_annotations.py), so they can be read without the log.
on:
  push:
    branches: [cleanup]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      QT_QPA_PLATFORM: offscreen
      DDE_BACKEND: pytorch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libfontconfig1 libdbus-1-3

      - name: Install PINNStudio (CPU PyTorch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then python -m pip install torch; \
          else python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install -e . pytest

      - name: Desktop shortcut
        shell: bash
        run: |
          python -m pinnstudio --create-shortcut
          python -m pinnstudio --remove-shortcut

      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider --durations=20 --ignore=tests/local --junitxml=junit.xml

      - name: Report failures
        if: always()
        run: python tools/junit_annotations.py junit.xml ${{ runner.os }}

      - name: Window end to end (train, results, restore)
        if: always()
        run: python tools/smoke_gui.py

  # The one-command installer as a user runs it (from this checkout instead of
  # PyPI), then the installed app: it starts, and the window check passes.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install with get-pinnstudio.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PINNSTUDIO_SOURCE = "${{ github.workspace }}"
          ./get-pinnstudio.ps1
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PINNStudio.lnk")) { throw "no Start menu shortcut" }

      - name: Install with get-pinnstudio.sh (macOS)
        if: runner.os == 'macOS'
        run: |
          PINNSTUDIO_SOURCE="$GITHUB_WORKSPACE" sh get-pinnstudio.sh
          test -x "$HOME/Applications/PINNStudio.app/Contents/MacOS/PINNStudio"

      - name: Installed app starts and the window check passes
        shell: bash
        run: |
          UV="$HOME/.local/bin/uv"
          TOOLDIR="$("$UV" tool dir)"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$TOOLDIR/pinnstudio/Scripts/python.exe"; EXE="$("$UV" tool dir --bin)/pinnstudio.exe";
          else PY="$TOOLDIR/pinnstudio/bin/python"; EXE="$("$UV" tool dir --bin)/pinnstudio"; fi
          "$PY" tools/launch_check.py "$EXE"
          cd "$RUNNER_TEMP" && "$PY" "$GITHUB_WORKSPACE/tools/smoke_gui.py" --installed
