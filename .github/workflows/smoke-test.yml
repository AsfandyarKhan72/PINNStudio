name: Smoke test

on:
  push:
    branches: [main, cleanup]
  pull_request:
    branches: [main]

jobs:
  boot-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install Python dependencies
        run: pip install PyQt6 numpy matplotlib pandas

      - name: Boot the GUI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          from PyQt6.QtWidgets import QApplication
          from pinnstudio.ui.main_window import MainWindow

          app = QApplication(sys.argv)
          app.setStyle('Fusion')
          window = MainWindow()
          window.show()
          app.processEvents()
          print('MainWindow booted successfully.')
          "

      - name: Template / mode regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_templates.py
          python tests/test_config_options.py
          python tests/test_export_parity.py
          python tests/test_v56_no_template_solve.py
          python tests/test_sweep_registry.py
          python tests/test_sweep_tab.py
          python tests/test_sweep_param_expansion.py
          python tests/test_training_callbacks_visibility.py
          python tests/test_custom_geometry.py
          python tests/test_steady_state_ic_weights.py
          python tests/test_restore_steady_state.py
          python tests/test_restore_geometry_masking.py
          python tests/test_restore_display_refresh.py
          python tests/test_prerelease_gui_tweaks.py
          python tests/test_ta_loss_history.py
          python tests/test_restore_ta_error_analysis.py
          python tests/test_plot_figsize_settings.py
          # These also run without torch/DeepXDE; any end-to-end parts that need
          # them print SKIPPED here and run fully under pytest locally.
          python tests/test_activation_choices.py
          python tests/test_line_comparison_geometry.py
          python tests/test_quick_examples_dimension_sync.py
          python tests/test_rar_round_diagnostics.py
          python tests/test_run_results_folder_naming.py
          python tests/test_solve_results_panel_save_dir.py
          python tests/test_steady_state_rar_gating.py
          python tests/test_ta_line_comparison_geometry.py
          python tests/test_viz_steps_linewidth_split.py
          python tests/test_round38_line_steps_masking.py
          python tests/test_round39_cleanup.py
          python tests/test_round40_ic_pretrain_restore_parity.py
          python tests/test_round41_ea_multi_output.py
          python tests/test_round42_restore_line_plot_refactor.py
          python tests/test_round43_restore_anim_surface_refactor.py
          python tests/test_round44_ta_surface_masking.py
          python tests/test_round45_restore_surface_refactor.py
          python tests/test_round46_anim_surface_masking.py
          python tests/test_round47_ic_pretrain_shared_block.py
          python tests/test_round48_preview_geometry_shared.py
          python tests/test_round49_param_axis_shared.py
          python tests/test_round50_shared_color_scale.py
          python tests/test_round51_ui_helpers.py
          python tests/test_round52_generate_script_split.py
          python tests/test_round53_export_rar_diagnostics.py
          python tests/test_round54_sweep_obs_weight.py
          python tests/test_round55_generator_naming.py
