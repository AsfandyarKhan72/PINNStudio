# Documentation site (MkDocs + Material).
#  - Every pull request and every push to the documentation branch builds the site with
#    `mkdocs build --strict` (any warning, broken internal link or missing page fails the build),
#    checks external links, and uploads the built site as a downloadable preview artifact.
#  - Deployment to GitHub Pages happens only on a published release, or when started by hand
#    from the main branch with deploy=true. It also needs the repository's Pages source set to
#    "GitHub Actions" (Settings > Pages); until that is switched on, the deploy job does nothing.
name: Documentation

on:
  pull_request:
    paths: ["website/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  push:
    branches: ["docs/official-site"]
    paths: ["website/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (main branch only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install MkDocs
        run: pip install -r website/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict --site-dir _site
      - name: Check links (internal and external)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/_site"
            --exclude-path _site/search --accept 200,206,429 --max-retries 2
            "_site/**/*.html"
          fail: true
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pinnstudio-docs-preview
          path: _site
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
