name: Quality

# Lint (ruff, pyflakes rules), the model-view-controller rules (tests/test_mvc.py) and the command line
# without a display: quick checks on every push, before the long platform tests.
on:
  push:
    branches: [main, cleanup, "integration/**", "feature/**", "review/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      DDE_BACKEND: pytorch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check pinnstudio tests tools
      - name: Install PINNStudio (CPU PyTorch)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Model, views and controllers
        run: python -m pytest tests/test_mvc.py -q -p no:cacheprovider
      - name: Command line without a display
        run: python -m pytest tests/test_cli.py -q -p no:cacheprovider
