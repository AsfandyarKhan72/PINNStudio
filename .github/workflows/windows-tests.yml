name: Windows tests

# The test suite on a real Windows machine: paths with backslashes, the
# desktop shortcut, pythonw.exe and the scripts PINNStudio generates and runs.
on:
  push:
    branches: [cleanup]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      DDE_BACKEND: pytorch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PINNStudio (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest

      - name: Desktop shortcut (real Start menu and Desktop)
        shell: pwsh
        run: |
          python -m pinnstudio --create-shortcut
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PINNStudio.lnk")) { throw "no Start menu shortcut" }
          python -m pinnstudio --remove-shortcut

      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider --durations=20 --ignore=tests/local --junitxml=junit.xml

      # Each failing test as an annotation on the run (readable without the full log)
      - name: Report failures
        if: always()
        run: python tools/junit_annotations.py junit.xml
