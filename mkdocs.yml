# PINNStudio documentation (MkDocs + Material). Build locally:
#   pip install -r website/requirements.txt
#   mkdocs serve            # live preview at http://127.0.0.1:8000
#   mkdocs build --strict   # what CI runs; fails on any warning
site_name: PINNStudio
site_description: A graphical platform for forward and inverse physics-informed neural networks.
site_author: Asfandyar Khan
site_url: https://asfandyarkhan72.github.io/PINNStudio/
repo_url: https://github.com/AsfandyarKhan72/PINNStudio
repo_name: AsfandyarKhan72/PINNStudio
# "Edit this page" / "View source of this page": the branch the website/ sources are edited on. Until the merge,
# website/ exists only on the docs and integration branches, and the link check would fail on main's 404s; in the
# merge commit into main, change this one line to edit/main/website/.
edit_uri: edit/docs/official-site/website/
docs_dir: website
# build files that sit in docs_dir but are not pages or assets
# (_snippets/: text included into pages with --8<--, e.g. the generated source-code links)
exclude_docs: |
  /requirements.txt
  /overrides/
  /_snippets/
copyright: >
  Copyright &copy; 2026 Asfandyar Khan. Released under the MIT License.

strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: website/overrides
  logo: assets/pinnstudio.png
  favicon: assets/pinnstudio.png
  language: en
  font: false            # system fonts: no external font requests
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

extra:
  generator: false
  # Source-code links (tools/docs/make_source_links.py, tools/docs/make_gallery.py): repo_blob + source_ref + path.
  # source_ref is a branch now; at a release set it to the release tag (e.g. v1.6.0) once the tag exists, and
  # rerun both generators (see website/developer/releases.md).
  repo_blob: https://github.com/AsfandyarKhan72/PINNStudio/blob/
  source_ref: main
  # "Report a documentation problem" (site footer, help/index.md): .github/ISSUE_TEMPLATE/documentation.md
  docs_issue_url: https://github.com/AsfandyarKhan72/PINNStudio/issues/new?template=documentation.md&labels=documentation
  version_label: "v1.6.0 (in development)"
  released_version: "v1.5.0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AsfandyarKhan72/PINNStudio
      name: PINNStudio on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [website]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:          # click a screenshot to see it at full size
      touchNavigation: true
      zoomable: true
      skip_classes: [no-zoom]

# Per-example pages are reached from the gallery (examples/index.md), not listed in the navigation
not_in_nav: |
  /examples/*/

